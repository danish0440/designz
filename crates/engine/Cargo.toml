[package]
name = "designz-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DesignZ engine: session, documents, history, selection, command registry, tool hosting"

[lints]
workspace = true

[dependencies]
craft-print = { workspace = true }
craft-docpath = { workspace = true }
designz-images = { workspace = true }
designz-geom = { workspace = true }
designz-color = { workspace = true }
designz-doc = { workspace = true }
designz-fonts = { workspace = true }
designz-compose = { workspace = true }
designz-render = { workspace = true }
designz-format = { workspace = true }
designz-epub = { workspace = true }
designz-pptx = { workspace = true }
designz-textimport = { workspace = true }
designz-pdf = { workspace = true }
craft-prepress = { workspace = true }
designz-tools = { workspace = true }
designz-idml = { workspace = true }
indd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
quick-xml = { workspace = true }
caseless = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
same-file = { workspace = true }

[dev-dependencies]
designz-fonts = { workspace = true, features = ["testing"] }
zip = { workspace = true }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

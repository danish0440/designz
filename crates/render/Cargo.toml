[package]
name = "designz-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DesignZ renderer: vello_cpu software rasterizer for canvas and exports"

[lints]
workspace = true

[dependencies]
designz-geom = { workspace = true }
designz-color = { workspace = true }
designz-doc = { workspace = true }
designz-fonts = { workspace = true }
designz-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
bytemuck = { workspace = true }
craft-pdf = { workspace = true, features = ["raster"] }
designz-images = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
craft-image-codecs = { workspace = true }

[dev-dependencies]
image = { workspace = true, features = ["png", "gif", "tiff"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }

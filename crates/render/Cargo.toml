[package]
name = "designz-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DesignZ renderer: spreads, pages, frames, composed text and images to pixels (vello_cpu)"

[lints]
workspace = true

[dependencies]
designz-geom = { workspace = true }
designz-color = { workspace = true }
designz-doc = { workspace = true }
designz-fonts = { workspace = true }
designz-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
hayro = { workspace = true }
designz-images = { workspace = true }
log = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }

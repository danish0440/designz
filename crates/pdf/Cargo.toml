[package]
name = "designz-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DesignZ PDF export (krilla): real text with embedded font subsets, CMYK/spot colour, bleed and printer's marks"

[lints]
workspace = true

[dependencies]
designz-geom = { workspace = true }
designz-color = { workspace = true }
designz-doc = { workspace = true }
designz-fonts = { workspace = true }
skrifa = { workspace = true }
designz-compose = { workspace = true }
craft-pdf = { workspace = true, features = ["read", "write-pdf", "write-svg"] }
craft-image-codecs = { workspace = true }
craft-prepress = { workspace = true }
craft-cms = { workspace = true }
designz-images = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
image = { workspace = true, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }
tiff = { workspace = true }
flate2 = "1"
designz-fonts = { workspace = true, features = ["testing"] }

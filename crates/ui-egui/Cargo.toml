[package]
name = "designz-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DesignZ egui frontend (InDesign-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
designz-geom = { workspace = true }
designz-color = { workspace = true }
designz-doc = { workspace = true }
designz-fonts = { workspace = true }
designz-compose = { workspace = true }
designz-render = { workspace = true }
designz-tools = { workspace = true }
designz-engine = { workspace = true }
unicode-bidi = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
unicode-segmentation = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
designz-idml = { workspace = true }
zip = { workspace = true }
# Headless (offscreen wgpu) rendering of the whole window for UI screenshots: `examples/ui_shot.rs`.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
designz-fonts = { workspace = true, features = ["testing"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
